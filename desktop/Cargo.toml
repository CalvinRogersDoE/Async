[package]
name = "async-desktop"
version = "0.4.0"
edition = "2024"
description = "Async for Linux and macOS: push the mouse through a screen edge to punch a portal into another computer"
license = "MIT"
authors = ["HallucinatesTigers"]

[[bin]]
name = "async-desktop"
path = "src/main.rs"

[dependencies]
# Remote Desktop client engine (Apache-2.0/MIT), pinned to a known commit.
ironrdp = { git = "https://github.com/Devolutions/IronRDP", rev = "b69cda2", default-features = false, features = ["connector", "input", "pdu", "client", "rustls"] }

winit = { version = "0.30", features = ["rwh_06"] }
softbuffer = "0.4"
raw-window-handle = "0.6"
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
smallvec = "1"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xinput", "randr", "shape", "xtest"] }
ksni = { version = "0.3", features = ["blocking"] }
keyring = { version = "3", features = ["async-secret-service", "tokio", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
core-graphics = { version = "0.24", features = ["highsierra"] }
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSResponder", "NSGraphics", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAShapeLayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", features = ["CGPath"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
tray-icon = "0.21"

[profile.release]
strip = true
